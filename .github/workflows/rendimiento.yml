# Pipeline de pruebas de rendimiento: levanta la API de Tiquetmania y ejecuta
# el plan de JMeter (200 usuarios en 5 minutos) en modo no-GUI.
name: Pruebas de rendimiento

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rendimiento:
    name: Carga con JMeter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JMETER_VERSION: "5.6.3"

    steps:
      # 1. Descarga el repositorio (la API y el plan viajan en el mismo commit)
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      # 2. JMeter 5.6.3 necesita Java 17
      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Instala JMeter y agrega su carpeta bin al PATH de los pasos siguientes
      - name: Instalar JMeter ${{ env.JMETER_VERSION }}
        run: |
          wget -q "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz"
          tar -xzf "apache-jmeter-${JMETER_VERSION}.tgz" -C "$HOME"
          echo "$HOME/apache-jmeter-${JMETER_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verificar JMeter
        run: jmeter --version

      # 4. Levanta la API en segundo plano (proceso de larga duración)
      - name: Levantar la API en el puerto 8080
        run: |
          nohup python3 api/ticketmania_simple.py --puerto 8080 > api.log 2>&1 &
          echo "API iniciada con PID $!"

      # 5. La prueba empieza solo cuando /api/salud responde
      - name: Esperar a que la API responda
        run: |
          for intento in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/salud; then
              echo ""
              echo "API lista (intento $intento)"
              exit 0
            fi
            sleep 2
          done
          echo "La API no respondió en 60 segundos"
          cat api.log
          exit 1

      # 6. Ejecuta el plan sin interfaz desde su carpeta (datos.csv es ruta relativa)
      - name: Ejecutar el plan de JMeter (no-GUI)
        working-directory: pruebas/jmeter
        run: jmeter -n -t Ticketmania.jmx -l resultados.jtl -e -o reporte

      # 7. JMeter no falla por peticiones fallidas: este paso revisa el .jtl
      - name: Revisar peticiones fallidas en el .jtl
        working-directory: pruebas/jmeter
        run: |
          python3 - <<'EOF'
          import csv, sys
          with open("resultados.jtl", newline="", encoding="utf-8") as f:
              filas = list(csv.DictReader(f))
          fallidas = [r for r in filas if r["success"].lower() != "true"]
          print(f"Muestras: {len(filas)} | Fallidas: {len(fallidas)}")
          for r in fallidas[:20]:
              print(f"  {r['label']}: {r['responseCode']} {r['responseMessage']} {r['failureMessage']}")
          if not filas:
              sys.exit("El .jtl está vacío: la prueba no generó muestras")
          if fallidas:
              sys.exit(f"Hay {len(fallidas)} peticiones fallidas")
          EOF

      # 8. Sube el reporte aunque un paso anterior haya fallado
      - name: Subir el reporte HTML
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reporte-rendimiento
          path: |
            pruebas/jmeter/reporte
            pruebas/jmeter/resultados.jtl
            api.log
          if-no-files-found: warn
